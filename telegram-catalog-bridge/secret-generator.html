<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private sync key generator</title><style>body{font:16px system-ui;max-width:42rem;margin:3rem auto;padding:0 1rem}textarea{box-sizing:border-box;width:100%;height:7rem;word-break:break-all}button{padding:1rem}</style><h1>Private sync key</h1><p>Open this downloaded file locally on your own device. It generates a key locally and does not connect to a server. Never send or screenshot the key.</p><button id="generate">Generate a new key</button><p><label for="secret">Key (copy privately to both settings)</label></p><textarea id="secret" readonly></textarea><script>document.getElementById('generate').onclick=()=>{try{const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);document.getElementById('secret').value=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}catch(e){document.getElementById('secret').value='Cannot generate securely on this device.'}};</script></html>
