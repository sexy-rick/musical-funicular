name: Update catalog Worker for website
on:
  push:
    branches:
      - arena/e09cf031-musical-funicular
    paths:
      - telegram-catalog-bridge/cloudflare/cors-deploy-trigger.txt
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --no-audit --no-fund wrangler@4.168.0
      - name: Prepare verified binding configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || vars.ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.ID }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node telegram-catalog-bridge/cloudflare/prepare-cors-deploy.cjs
      - name: Deploy while retaining secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || vars.ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.ID }}
        run: '"$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" deploy --keep-vars --config "$RUNNER_TEMP/catalog-cors-wrangler.json"'
      - name: Verify public catalog and browser access
        run: |
          curl --fail --silent --show-error --max-time 15 -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/catalog" 'https://mc-catalog-1474006216.aman-nsipai.workers.dev/addons'
          grep -qi '^access-control-allow-origin: https://marketplacetrader.great-site.net' "$RUNNER_TEMP/headers"
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/catalog","utf8")); if (!x.ok || !Array.isArray(x.items)) process.exit(1); console.log("Catalog responds; browser access enabled.")'
          node -e 'async function main(){const base="https://mc-catalog-1474006216.aman-nsipai.workers.dev/addons";const a=await fetch(base+"?creator=__no_matching_studio_456__");const data=await a.json();if(!a.ok||!data.ok||data.total!==0||a.headers.get("cache-control")!=="no-store")throw Error("Creator filter or cache policy failed");const b=await fetch(base+"?updated=invalid");if(b.status!==400)throw Error("Date validation failed");console.log("Studio filter, date validation and no-store verified.");}main().catch(e=>{console.error(e.message);process.exit(1)})'
