name: Check catalog connection
on:
  push:
    branches:
      - arena/e09cf031-musical-funicular
    paths:
      - telegram-catalog-bridge/cloudflare/check-trigger.txt
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Worker health
        run: |
          curl --fail --silent --show-error --max-time 15 https://mc-catalog-1474006216.aman-nsipai.workers.dev/health
      - name: Check catalog read
        run: |
          curl --fail --silent --show-error --max-time 15 https://mc-catalog-1474006216.aman-nsipai.workers.dev/addons
