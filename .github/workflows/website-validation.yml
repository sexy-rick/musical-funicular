name: Validate website ZIP
on:
  push:
    branches: [arena/e09cf031-musical-funicular]
    paths:
      - 'telegram-catalog-bridge/website/**'
      - 'telegram-catalog-bridge/tests/**'
      - 'telegram-catalog-bridge/website-upload.zip'
      - '.github/workflows/website-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install test-only tools
        run: npm install --prefix "$RUNNER_TEMP/website-test" --no-audit --no-fund jsdom playwright-core @sparticuz/chromium @php-wasm/cli
      - name: Run website tests and PHP lint
        env:
          NODE_PATH: ${{ runner.temp }}/website-test/node_modules
          PHP_WASM_CLI: ${{ runner.temp }}/website-test/node_modules/.bin/php-wasm-cli
        run: |
          set -eu
          find telegram-catalog-bridge/website -type f -name '*.php' -print0 | xargs -0 -n1 "$PHP_WASM_CLI" -l
          node --check telegram-catalog-bridge/website/assets/catalog-v14.js
          node telegram-catalog-bridge/tests/website-v14.test.cjs
          CATALOG_VERSION=v14 node telegram-catalog-bridge/tests/website-v13.test.cjs
          CATALOG_VERSION=v14 node telegram-catalog-bridge/tests/website-v12.test.cjs
          CATALOG_VERSION=v14 node telegram-catalog-bridge/tests/website-v11.test.cjs
          node telegram-catalog-bridge/tests/website.test.cjs
          node telegram-catalog-bridge/tests/search-suggestions.test.cjs
          node telegram-catalog-bridge/tests/branding.test.cjs
      - name: Test responsive browser behavior
        env:
          NODE_PATH: ${{ runner.temp }}/website-test/node_modules
          PHP_WASM_CLI: ${{ runner.temp }}/website-test/node_modules/.bin/php-wasm-cli
        run: |
          if ! node telegram-catalog-bridge/tests/website.browser.test.cjs > "$RUNNER_TEMP/browser-test.log" 2>&1; then
            cat "$RUNNER_TEMP/browser-test.log"
            grep -E -m 8 "AssertionError|Error:|actual:|expected:|at .*website.browser|overflow|Error \[" "$RUNNER_TEMP/browser-test.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/browser-test.log"
      - name: Check website ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('telegram-catalog-bridge/website')
          files = {str(p.relative_to(root)): p for p in root.rglob('*') if p.is_file()}
          with ZipFile('telegram-catalog-bridge/website-upload.zip') as z:
              assert z.testzip() is None
              names = z.namelist()
              assert len(names) == len(set(names)) and set(names) == set(files)
              assert {'.htaccess','alium.php','assets/alium-icon.png','assets/catalog-v14.js','assets/site-v14.css'} <= set(names)
              assert not any(n.endswith(('config.php','.env','.sql','.key','.apk')) for n in names)
              for name in names:
                  assert z.read(name) == files[name].read_bytes(), name
          print('ZIP integrity, contents and secrets exclusions passed')
          PY
