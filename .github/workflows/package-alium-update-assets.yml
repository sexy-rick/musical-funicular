name: Package Alium GitHub release files
on:
  push:
    branches: [arena/e09cf031-musical-funicular]
    paths:
      - '.github/workflows/package-alium-update-assets.yml'
      - 'android-app/scripts/create_update_metadata.py'
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Download signed candidate and baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh run download 46153381931 --name Alium-Android-signed-release --dir "$RUNNER_TEMP/candidate"
          gh run download 46142596059 --name Alium-Android-signed-release --dir "$RUNNER_TEMP/baseline"
          test -f "$RUNNER_TEMP/candidate/app-release.apk"
          test -f "$RUNNER_TEMP/baseline/app-release.apk"
      - name: Verify APKs and create two release files
        run: |
          set -eu
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          export PATH="$(dirname "$APKSIGNER"):$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          test "$(apkanalyzer manifest version-code "$RUNNER_TEMP/candidate/app-release.apk")" = 4
          test "$(apkanalyzer manifest version-name "$RUNNER_TEMP/candidate/app-release.apk")" = 0.1.0
          mkdir -p "$RUNNER_TEMP/release-package"
          printf '%s\n' 'Detail-page layout and catalog browsing improvements.' 'Improved handling of multi-file Telegram responses.' 'Android device testing is pending.' > "$RUNNER_TEMP/release-notes.txt"
          if ! python3 android-app/scripts/create_update_metadata.py \
            --apk "$RUNNER_TEMP/candidate/app-release.apk" \
            --baseline "$RUNNER_TEMP/baseline/app-release.apk" \
            --tag v0.1.0 \
            --notes "$RUNNER_TEMP/release-notes.txt" \
            --output "$RUNNER_TEMP/release-package/update.json" 2> "$RUNNER_TEMP/metadata-error"; then
            echo "::error::$(cat "$RUNNER_TEMP/metadata-error")"
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-package/README.md" <<'TEXT'
          # Alium releases

          Official Android releases of Alium by Marketplace Trader are attached to this repository's GitHub Releases. Alium's application source is maintained separately.

          ## Install

          Download the APK from a GitHub Release and install it through Android. An in-place update requires the same package and signing key. Do not uninstall simply to force an update: that can erase private session and history data.

          ## Publish this beta

          Create a pre-release with tag `v0.1.0` and attach the matching `app-release.apk` and `update.json` as release assets. The APK is supplied separately from this two-file ZIP. The displayed version is 0.1.0 but Android version code 4 is newer than the prior code 3. Do not overwrite an older release or upload private source, credentials or signing keys.

          Alium's beta-aware updater checks published beta and stable releases. Both release assets are required. Users of the older stable-only updater need a manual install before beta updates can be discovered. Test a later higher-version release on Android to verify the complete update flow. The hash detects corruption, not a compromised release account.

          Support: https://t.me/minecraft_group_chat_friends · https://t.me/alchemisst
          Website: https://marketplacetrader.great-site.net/

          Minecraft is a trademark of its respective owners. Alium is an independent community project.
          TEXT
          python3 - "$RUNNER_TEMP/release-package" <<'PY'
          import os, sys
          names = sorted(os.listdir(sys.argv[1]))
          if names != ['README.md', 'update.json']:
              raise SystemExit(f'Unexpected release files: {names}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: release_files
        with:
          name: Alium-GitHub-two-release-files-v0.1.0
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          retention-days: 14
      - name: Verify uploaded ZIP and APK metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.release_files.outputs.artifact-id }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/release.zip"
          python3 - "$RUNNER_TEMP/release.zip" "$RUNNER_TEMP/candidate/app-release.apk" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert sorted(z.namelist()) == ['README.md', 'update.json'], z.namelist()
              assert z.testzip() is None
              metadata = json.loads(z.read('update.json'))
          apk = Path(sys.argv[2])
          assert metadata['size'] == apk.stat().st_size
          with apk.open('rb') as f:
              digest = hashlib.file_digest(f, 'sha256').hexdigest()
          assert metadata['sha256'] == digest
          print('::notice::Verified ZIP contains exactly README.md and update.json')
          print(f"::notice::APK package {metadata['packageId']}, version {metadata['versionName']}+{metadata['versionCode']}, min SDK {metadata['minSdk']}, size {metadata['size']}, SHA-256 {digest}")
          PY
