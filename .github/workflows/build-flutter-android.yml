name: Build Alium signed Android release
on:
  workflow_dispatch:
  push:
    branches: [arena/e09cf031-musical-funicular]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-flutter-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: android-app
        run: |
          flutter create --platforms=android --project-name marketplace_trader --org net.greatsite .
          python3 scripts/configure_android.py
          python3 scripts/install_tdlib.py
      - name: Install dependencies
        working-directory: android-app
        run: flutter pub get
      - name: Analyze and test
        working-directory: android-app
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/flutter-analyze.log 2>&1
          code=$?
          cat /tmp/flutter-analyze.log
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/flutter-analyze.log
            exit "$code"
          fi
          flutter test > /tmp/flutter-test.log 2>&1
          code=$?
          cat /tmp/flutter-test.log
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/flutter-test.log
            exit "$code"
          fi
      - name: Validate release compilation if signing is unconfigured
        working-directory: android-app
        env:
          ALIUM_KEYSTORE_BASE64: ${{ secrets.ALIUM_KEYSTORE_BASE64 }}
          ALIUM_KEYSTORE_PASSWORD: ${{ secrets.ALIUM_KEYSTORE_PASSWORD }}
          ALIUM_KEY_ALIAS: ${{ secrets.ALIUM_KEY_ALIAS }}
          ALIUM_KEY_PASSWORD: ${{ secrets.ALIUM_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$ALIUM_KEYSTORE_BASE64" ] || [ -z "$ALIUM_KEYSTORE_PASSWORD" ] || [ -z "$ALIUM_KEY_ALIAS" ] || [ -z "$ALIUM_KEY_PASSWORD" ]; then
            echo 'Compiling with a disposable validation key; this APK will not be uploaded.'
            export ALIUM_KEYSTORE_PATH="$RUNNER_TEMP/alium-validation.jks"
            export ALIUM_KEYSTORE_PASSWORD=validation-only-password
            export ALIUM_KEY_ALIAS=validation
            export ALIUM_KEY_PASSWORD=validation-only-password
            trap 'rm -f "$ALIUM_KEYSTORE_PATH" build/app/outputs/flutter-apk/app-release.apk' EXIT
            keytool -genkeypair -keystore "$ALIUM_KEYSTORE_PATH" -storepass "$ALIUM_KEYSTORE_PASSWORD" -keypass "$ALIUM_KEY_PASSWORD" -alias "$ALIUM_KEY_ALIAS" -dname 'CN=Temporary validation only' -keyalg RSA -keysize 2048 -validity 2 -noprompt >/dev/null 2>&1
            flutter build apk --release
          fi
      - name: Build signed release APK
        working-directory: android-app
        env:
          TELEGRAM_API_ID: ${{ secrets.TGID }}
          TELEGRAM_API_HASH: ${{ secrets.TGHASH }}
          ALIUM_KEYSTORE_BASE64: ${{ secrets.ALIUM_KEYSTORE_BASE64 }}
          ALIUM_KEYSTORE_PASSWORD: ${{ secrets.ALIUM_KEYSTORE_PASSWORD }}
          ALIUM_KEY_ALIAS: ${{ secrets.ALIUM_KEY_ALIAS }}
          ALIUM_KEY_PASSWORD: ${{ secrets.ALIUM_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$ALIUM_KEYSTORE_BASE64" ] || [ -z "$ALIUM_KEYSTORE_PASSWORD" ] || [ -z "$ALIUM_KEY_ALIAS" ] || [ -z "$ALIUM_KEY_PASSWORD" ]; then
            echo '::error::Release signing secrets are required; no debug signing fallback is permitted.'
            exit 1
          fi
          if { [ -n "$TELEGRAM_API_ID" ] && [ -z "$TELEGRAM_API_HASH" ]; } || { [ -z "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; }; then
            echo '::error::Both TGID and TGHASH must be configured together.'
            exit 1
          fi
          export ALIUM_KEYSTORE_PATH="$RUNNER_TEMP/alium-release.jks"
          trap 'rm -f "$ALIUM_KEYSTORE_PATH"' EXIT
          if ! printf '%s' "$ALIUM_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$ALIUM_KEYSTORE_PATH" 2>/dev/null; then
            echo '::error::ALIUM_KEYSTORE_BASE64 is not valid base64. Copy the complete output without the prompt.'
            exit 1
          fi
          if [ ! -s "$ALIUM_KEYSTORE_PATH" ]; then
            echo '::error::The decoded release keystore is empty.'
            exit 1
          fi
          if ! keytool -list -keystore "$ALIUM_KEYSTORE_PATH" -storepass:env ALIUM_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo '::error::Could not open the keystore. Check the complete base64 value and keystore password.'
            exit 1
          fi
          if ! keytool -list -keystore "$ALIUM_KEYSTORE_PATH" -storepass:env ALIUM_KEYSTORE_PASSWORD -alias "$ALIUM_KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::The key alias was not found in the keystore.'
            exit 1
          fi
          if [ -n "$TELEGRAM_API_ID" ]; then
            flutter build apk --release --dart-define="TELEGRAM_API_ID=$TELEGRAM_API_ID" --dart-define="TELEGRAM_API_HASH=$TELEGRAM_API_HASH"
          else
            flutter build apk --release
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Alium-Android-signed-release
          path: android-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
